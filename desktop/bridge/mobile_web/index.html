<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <title>HAI 遥控器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <button id="back" class="icon" hidden>‹</button>
    <div id="title">HAI</div>
    <button id="menu" class="icon" hidden>⋯</button>
  </header>

  <main id="screen-pair" class="screen">
    <h1>连接桌面端</h1>
    <p class="hint">在桌面端「设置 → 手机连接」里拿到 6 位配对码。</p>
    <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <input id="pair-name" placeholder="设备名（可空）">
    <button id="pair-btn" class="primary">连接</button>
    <p id="pair-error" class="error" hidden></p>
    <p id="pair-addr" class="hint"></p>
  </main>

  <main id="screen-list" class="screen" hidden>
    <div class="row">
      <select id="ws-select"></select>
      <button id="ws-add" class="icon" title="添加工作区">＋</button>
    </div>
    <button id="ws-pick" class="ghost" style="width:100%;margin-bottom:10px">在电脑上选择目录…</button>
    <p id="ws-wait" class="hint" hidden>等待电脑选择…（5 分钟内有效）</p>
    <button id="new-session" class="primary">新建会话</button>
    <ul id="sessions"></ul>
    <p id="list-empty" class="hint" hidden>这个工作区还没有会话。</p>
  </main>

  <main id="screen-chat" class="screen" hidden>
    <div id="messages"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send" class="primary">发送</button>
      <button id="stop" class="danger" hidden>停止</button>
    </div>
  </main>

  <!-- HITL：审批 -->
  <div id="approval" class="sheet" hidden>
    <div class="sheet-head">需要你确认</div>
    <div id="approval-body"></div>
    <div class="sheet-actions">
      <button id="approval-reject" class="ghost">拒绝</button>
      <button id="approval-approve" class="primary">同意</button>
    </div>
  </div>

  <!-- HITL：提问 -->
  <div id="questions" class="sheet" hidden>
    <div class="sheet-head">问你几个问题</div>
    <div id="questions-body"></div>
    <div class="sheet-actions">
      <button id="questions-skip" class="ghost">跳过</button>
      <button id="questions-submit" class="primary">提交</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
