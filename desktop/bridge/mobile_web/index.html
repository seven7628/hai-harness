<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <title>HAI 遥控器</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <button id="back" class="icon" hidden>‹</button>
    <div id="title">HAI</div>
    <button id="menu" class="icon" hidden>⋯</button>
  </header>

  <!-- 配对 -->
  <main id="screen-pair" class="screen">
    <h1>连接桌面端</h1>
    <p class="hint">在桌面端「设置 → 手机连接」里拿到 6 位配对码，或直接扫二维码。</p>
    <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <input id="pair-name" placeholder="设备名（可空）">
    <button id="pair-btn" class="primary">连接</button>
    <p id="pair-error" class="error" hidden></p>
    <p id="pair-addr" class="hint"></p>
  </main>

  <!-- 会话列表 -->
  <main id="screen-list" class="screen" hidden>
    <div class="row">
      <select id="ws-select"></select>
      <button id="ws-manage" class="icon" title="管理工作区">⚙</button>
    </div>
    <button id="new-session" class="primary">新建会话</button>
    <ul id="sessions"></ul>
    <p id="list-empty" class="hint" hidden>这个工作区还没有会话。</p>
  </main>

  <!-- 工作区管理 -->
  <main id="screen-workspaces" class="screen" hidden>
    <ul id="ws-list"></ul>
    <button id="ws-pick" class="primary">在电脑上选择目录…</button>
    <p id="ws-wait" class="hint" hidden>等待电脑选择…（5 分钟内有效）</p>
    <button id="ws-manual" class="ghost" style="width:100%;margin-top:8px">手动输入路径</button>
  </main>

  <!-- 会话 -->
  <main id="screen-chat" class="screen" hidden>
    <button id="agents-bar" class="agents-bar" hidden></button>
    <div id="messages"></div>
    <button id="jump" class="jump" hidden>↓ 最新</button>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send" class="primary">发送</button>
      <button id="stop" class="danger" hidden>停止</button>
    </div>
  </main>

  <!-- 子智能体列表 -->
  <main id="screen-agents" class="screen" hidden>
    <ul id="agents-list"></ul>
    <p id="agents-empty" class="hint" hidden>当前会话没有子智能体。</p>
  </main>

  <!-- 单个子智能体 -->
  <main id="screen-agent" class="screen" hidden>
    <div id="agent-meta" class="hint"></div>
    <div id="agent-messages"></div>
    <div id="composer">
      <textarea id="agent-input" rows="1" placeholder="对它说点什么…"></textarea>
      <button id="agent-send" class="primary">发送</button>
      <button id="agent-stop" class="danger" hidden>停止</button>
    </div>
  </main>

  <!-- HITL：审批 -->
  <div id="approval" class="sheet" hidden>
    <div class="sheet-head">需要你确认</div>
    <div id="approval-body"></div>
    <div class="sheet-actions">
      <button id="approval-reject" class="ghost">拒绝</button>
      <button id="approval-approve" class="primary">同意</button>
    </div>
  </div>

  <!-- HITL：提问 -->
  <div id="questions" class="sheet" hidden>
    <div class="sheet-head">问你几个问题</div>
    <div id="questions-body"></div>
    <div class="sheet-actions">
      <button id="questions-skip" class="ghost">跳过</button>
      <button id="questions-submit" class="primary">提交</button>
    </div>
  </div>

  <!-- 通用动作面板（会话重命名/置顶/删除） -->
  <div id="actions" class="sheet" hidden>
    <div class="sheet-head" id="actions-title"></div>
    <div id="actions-body"></div>
    <div class="sheet-actions">
      <button id="actions-cancel" class="ghost">取消</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
