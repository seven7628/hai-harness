<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- HAI macOS 应用图标 · 夜墨（深色）版
       ─────────────────────────────────────────────────────────────────────
       形状：Apple macOS 应用图标网格 —— 1024 画布内 824×824 圆角方（squircle，
             四周留白 100，连续曲率圆角，边缘平直段长 210.87）。
             下方 #tile 的路径由 Apple 自家图标（Claude.app 1024 层）的 alpha 边界
             反求而来，N=17 样条拟合，与参考边界最大法向偏差 0.10px@1024。
             改动需重跑 build/make-icons.mjs 重新生成 HAI.icns。
       配色：取自品牌【墨·浓淡】深色版（brand/hai-logo-dark.svg）与桌面端 ink 主题
             （desktop/app/src/index.css）—— 底 #1a1614 暖黑，笔锋
             亮墨 #F2F1EE / 朱砂 #C23A2E / 淡墨 #A6A6B0。
       ⚠️ #mark 与 #tile 的 id 被 make-icons.mjs 的「小尺寸简化」样式覆盖引用，勿改名。
  -->
  <defs>
    <!-- 底：上暖下冷的纵向渐变，给圆角方一点体积感 -->
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2622"/>
      <stop offset="0.52" stop-color="#1c1714"/>
      <stop offset="1" stop-color="#110e0c"/>
    </linearGradient>
    <!-- 顶部柔光：macOS 图标常见的「玻璃面」高光 -->
    <radialGradient id="tileGlow" cx="0.5" cy="0.04" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 内描边：顶亮底暗的 1px 玻璃边，避免深色底在深色桌面上糊成一团 -->
    <linearGradient id="tileRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

