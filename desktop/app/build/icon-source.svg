4 108.75 774.48 C 106.66 767.91 104.95 761.16 103.66 754.39 C 102.38 747.62 101.66 740.71 101.05 733.83 C 100.43 726.96 100 720.04 100 713.13 L 100 310.87 C 100 303.96 100.43 297.04 101.05 290.17 C 101.66 283.29 102.38 276.38 103.66 269.61 C 104.95 262.84 106.66 256.09 108.75 249.52 C 110.85 242.96 113.5 236.54 116.21 230.19 C 118.93 223.85 121.85 217.56 125.06 211.46 C 128.28 205.35 131.79 199.37 135.52 193.57 C 139.25 187.77 143.2 182.07 147.47 176.67 C 151.75 171.27 156.3 166.03 161.17 161.17 C 166.03 156.3 171.27 151.75 176.67 147.47 C 182.07 143.2 187.77 139.25 193.57 135.52 C 199.37 131.79 205.35 128.28 211.46 125.06 C 217.56 121.85 223.85 118.93 230.19 116.21 C 236.54 113.5 242.96 110.85 249.52 108.75 C 256.09 106.66 262.84 104.95 269.61 103.66 C 276.38 102.38 283.29 101.66 290.17 101.05 C 297.04 100.43 303.96 100 310.87 100 Z"/>

    <!-- 品牌字标（brand/hai-logo-dark.svg 深色版，原样几何） -->
    <g id="mark" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#F2F1EE" d="M100 300 L132 120"/>
      <path stroke="#F2F1EE" d="M115 215 L286 215"/>
      <path stroke="#C23A2E" d="M210 300 L251 70"/>
      <path stroke="#A6A6B0" d="M251 70 L345 300"/>
      <path stroke="#A6A6B0" d="M430 300 L462 120"/>
    </g>
  </defs>

  <g id="shadowLayer"><use href="#tile" filter="url(#tileShadow)" fill="#000000"/></g>
  <use href="#tile" fill="url(#tileBg)"/>
  <g id="glowLayer"><use href="#tile" fill="url(#tileGlow)"/></g>
  <g id="rimLayer"><use href="#tile" fill="none" stroke="url(#tileRim)" stroke-width="2.5"/></g>

  <g id="markLayer" transform="translate(162.27,281.75) scale(1.24)"><use href="#mark"/></g>
</svg>
